name: Daily AI Memory Research Watch

on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research-watch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect research digest
        run: pnpm research:collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate generated research archive
        run: pnpm check:research

      - name: Commit research updates
        run: |
          if git diff --quiet -- content/research src/data/researchDigest.json; then
            echo "No research updates to commit."
            exit 0
          fi
          git config user.name "memorybench-research-agent"
          git config user.email "memorybench-research-agent@users.noreply.github.com"
          git add content/research src/data/researchDigest.json
          git commit -m "Update daily AI memory research digest"
          git push
